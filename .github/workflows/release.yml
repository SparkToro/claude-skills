name: Release

# Push a tag like v0.2.0 to publish a GitHub Release with one zip per skill.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        run: TAG="${GITHUB_REF_NAME}" scripts/check-versions.sh

      - name: Build skill zips
        run: scripts/build-zips.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
